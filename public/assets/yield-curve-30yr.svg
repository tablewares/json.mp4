<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <!-- Editorial line chart: 30-year US Treasury yield climbing to its highest since 2007. Coral curve over a soft cream plot; muted axis grid. Pairs with the "market reaction" scene on the cream canvas. -->
  <rect x="0" y="0" width="720" height="360" fill="#faf9f5" rx="16" />
  <g stroke="#e6dfd8" stroke-width="1.5">
    <line x1="80" y1="80"  x2="660" y2="80" />
    <line x1="80" y1="160" x2="660" y2="160" />
    <line x1="80" y1="240" x2="660" y2="240" />
    <line x1="80" y1="280" x2="660" y2="280" stroke="#8e8b82" stroke-width="2" />
  </g>
  <g fill="#8e8b82" font-family="Inter, sans-serif" font-size="16" font-weight="500">
    <text x="64" y="86" text-anchor="end">6.0%</text>
    <text x="64" y="166" text-anchor="end">5.0%</text>
    <text x="64" y="246" text-anchor="end">4.0%</text>
    <text x="64" y="286" text-anchor="end">3.0%</text>
  </g>
  <!-- Yield curve: rises left-to-right, ends at 5.84% (near top) -->
  <path d="M80 264 C140 250 200 240 260 220 S380 180 460 140 S600 96 640 86"
        fill="none" stroke="#cc785c" stroke-width="5" stroke-linecap="round" />
  <!-- Final-point marker -->
  <circle cx="640" cy="86" r="9" fill="#cc785c" />
  <text x="640" y="60" text-anchor="middle" fill="#141413"
        font-family="Cormorant Garamond, serif" font-size="28" font-weight="500">5.84%</text>
  <!-- X-axis labels (months) -->
  <g fill="#8e8b82" font-family="Inter, sans-serif" font-size="15" font-weight="500">
    <text x="80"  y="320" text-anchor="middle">Apr</text>
    <text x="220" y="320" text-anchor="middle">May</text>
    <text x="360" y="320" text-anchor="middle">Jun</text>
    <text x="500" y="320" text-anchor="middle">Jul</text>
    <text x="640" y="320" text-anchor="middle">Now</text>
  </g>
</svg>
